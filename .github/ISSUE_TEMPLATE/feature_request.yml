name: Feature Request
description: Suggest a new feature or enhancement for Firefly
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement to Firefly!

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: A clear, concise description of the feature you're requesting.
      placeholder: e.g. "I'd like guest users to be able to save SQL queries between sessions"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point this feature would address.
      placeholder: e.g. "Currently guest users lose their queries when the session expires, which makes it hard to run the same demo twice"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or alternative approaches you've thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Firefly does this relate to?
      options:
        - Guest User Management
        - Unity Catalog / Data Browser
        - SQL Editor
        - Embedded Dashboard
        - Pipeline Studio
        - Settings / Admin
        - Authentication / SSO
        - Databricks Apps
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or anything else that helps explain the request.
    validations:
      required: false
