name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: e.g. "The catalog browser shows an error when clicking on a schema"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. "The schema should expand and show its tables"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a guest user
        2. Open the Unity Catalog browser
        3. Click on firefly_demo_tables
        4. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Firefly is affected?
      options:
        - Guest User Management
        - Unity Catalog / Data Browser
        - SQL Editor
        - Embedded Dashboard
        - Pipeline Studio
        - Settings / Admin
        - Authentication / SSO
        - Databricks Apps
        - Other
    validations:
      required: true

  - type: dropdown
    id: user-type
    attributes:
      label: User type
      options:
        - Guest user
        - Regular user (SSO/SPN)
        - Admin
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, screenshots, error messages, or anything else useful.
    validations:
      required: false
