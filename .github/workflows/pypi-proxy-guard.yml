name: PyPI proxy guard

on:
  pull_request:
    branches:
      - genie-agent
  push:
    branches:
      - genie-agent

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run hermetic proxy guard tests
        run: bash tests/test_pypi_proxy_guard.sh
